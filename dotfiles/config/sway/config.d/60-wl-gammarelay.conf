# Start only enabled services, after importing the current Sway connection.
# Restore does not start wl-gammarelay itself and waits for its output objects.
exec sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && { if systemctl --user is-enabled --quiet wl-gammarelay.service; then systemctl --user start wl-gammarelay.service; fi; if systemctl --user is-enabled --quiet uq-bright-restore.service; then systemctl --user start uq-bright-restore.service; fi; }'
